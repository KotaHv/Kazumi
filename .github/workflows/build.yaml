name: Branch-specific workflow

on:
  push:
    branches:
      - webview-test
  workflow_dispatch:

jobs:
  flutter-build-android:
    name: "Build Android (unsigned)"
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Print Flutter info
        run: flutter doctor -v
        shell: bash

      - name: Build unsigned APK
        run: flutter build apk --split-per-abi
        shell: bash

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_unsigned_apks
          path: build/app/outputs/flutter-apk/*.apk
